name: Existing public research handoff receiving
on:
  push:
    branches: [ops-forensics/admission-language-scan-20261018]
    paths: [.github/workflows/research-handoff-receiving.yml]
permissions: {}
# Data-only receiving on a standard hosted VM. No checkout, installed packages,
# secrets, model call, scheduling, artifact/cache upload or private/native inputs.
jobs:
  existing-handoff:
    if: github.repository == 'opsmark/Ops_missions'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Receive the exact public HTML and ZIP, inspect without execution
        shell: python
        run: |
          import csv, hashlib, io, json, re, stat, sys, urllib.parse, urllib.request, zipfile
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from pathlib import PurePosixPath
          origin='https://ops-workflow-cost-calculator.rass991.chatgpt.site'
          base=origin+'/assets/research-brief-example/'
          allowed={base+'index.html',base+'research-brief-example.zip'}
          report={'schema':'ops099.public-research-handoff-receiving/1','started_utc':datetime.now(timezone.utc).isoformat(),'status':'NOT_COMPLETED','reads':[],'limits':['Public artifact readback, not client work, source-fact verification, native delivery, PDF visual review or malware-free certification.','No ZIP member is extracted or executed. Browser read/click acceptance remains in the distinct prior workflow.'],'errors':[]}
          class Redirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  resolved=urllib.parse.urljoin(req.full_url,newurl)
                  if resolved not in allowed: raise RuntimeError('Redirect outside exact public-artifact allowlist')
                  return super().redirect_request(req,fp,code,msg,headers,resolved)
          opener=urllib.request.build_opener(Redirects)
          def receive(url,cap):
              req=urllib.request.Request(url,headers={'User-Agent':'OPS-public-artifact-receiving/1'},method='GET')
              with opener.open(req,timeout=20) as r:
                  b=r.read(cap+1)
                  if r.status!=200 or r.geturl() not in allowed or len(b)>cap: raise RuntimeError('HTTP identity/status/size admission failed')
                  report['reads'].append({'url':url,'final_url':r.geturl(),'status':r.status,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'content_type':r.headers.get('Content-Type')})
                  return b
          class InspectHTML(HTMLParser):
              def __init__(self): super().__init__();self.in_title=False;self.in_body=False;self.in_tbody=False;self.rows=0;self.title=[];self.text=[];self.links=[];self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='title': self.in_title=True
                  if tag=='body': self.in_body=True
                  if tag=='tbody': self.in_tbody=True
                  if tag=='tr' and self.in_tbody: self.rows+=1
                  if tag=='a' and a.get('href'): self.links.append(a['href'])
                  if tag=='script': self.scripts.append(a.get('src','INLINE_NOT_EXECUTED'))
              def handle_endtag(self,tag):
                  if tag=='title': self.in_title=False
                  if tag=='body': self.in_body=False
                  if tag=='tbody': self.in_tbody=False
              def handle_data(self,data):
                  if self.in_title:self.title.append(data)
                  if self.in_body and data.strip():self.text.append(data.strip())
          try:
              html=receive(base+'index.html',300000)
              page=InspectHTML();page.feed(html.decode('utf-8-sig'))
              report['public_reader']={'title':''.join(page.title),'tbody_data_rows':page.rows,'links':page.links,'scripts_not_executed':page.scripts,'text_excerpt':'\n'.join(page.text)[:2500]}
              blob=receive(base+'research-brief-example.zip',2000000)
              with zipfile.ZipFile(io.BytesIO(blob)) as z:
                  infos=z.infolist()
                  if len(infos)>40 or sum(i.file_size for i in infos)>4000000:raise RuntimeError('Archive bounds exceeded')
                  names=set(); files=[];csv_names=[]
                  approved={'.csv','.pdf','.html','.htm','.md','.txt','.css','.json','.png','.jpg','.jpeg','.svg'}
                  for info in infos:
                      name=info.filename;p=PurePosixPath(name)
                      if '\\' in name or ':' in name or p.is_absolute() or '..' in p.parts or any(ord(c)<32 for c in name) or stat.S_ISLNK(info.external_attr>>16):raise RuntimeError('Unsafe archive member')
                      if name.casefold() in names:raise RuntimeError('Duplicate/case-colliding archive member')
                      names.add(name.casefold())
                      if info.is_dir():continue
                      if p.suffix.lower() not in approved or info.flag_bits&1:raise RuntimeError('Unexpected executable/encrypted/archive member')
                      b=z.read(info)
                      item={'name':name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
                      if p.suffix.lower()=='.pdf':item['pdf_header_only']=b.startswith(b'%PDF-')
                      files.append(item)
                      if p.suffix.lower()=='.csv':csv_names.append(name)
                  if z.testzip() is not None:raise RuntimeError('Archive CRC failed')
                  report['archive']={'members':len(infos),'expanded_bytes':sum(i.file_size for i in infos),'crc':'PASS','member_path_checks':'PASS','files':files}
                  if len(csv_names)!=1:raise RuntimeError('Expected one unambiguous research-row CSV')
                  raw=z.read(csv_names[0]).decode('utf-8-sig')
                  reader=csv.DictReader(io.StringIO(raw,newline=''));rows=list(reader)
                  columns=reader.fieldnames or []
                  url_columns=[c for c in columns if 'url' in c.lower()]
                  urls_by_row=[]
                  for row in rows:
                      vals=[row.get(c,'') or '' for c in url_columns]
                      urls=[u for v in vals for u in re.findall(r'https://[^\s<>"\x27]+',v)]
                      urls_by_row.append(urls)
                  all_urls=[u for row in urls_by_row for u in row]
                  hosts=sorted({urllib.parse.urlsplit(u).hostname for u in all_urls})
                  report['research_rows']={'file':csv_names[0],'columns':columns,'data_rows':len(rows),'url_columns':url_columns,'each_row_has_source_url':all(urls_by_row),'source_hosts':hosts,'csv_rectangular':all(None not in row and all(v is not None for v in row.values()) for row in rows)}
                  readers=[i for i in files if PurePosixPath(i['name']).suffix.lower() in {'.html','.htm'}]
                  report['offline_readers']=[{'name':i['name'],'matches_public_html_bytes':i['sha256']==hashlib.sha256(html).hexdigest()} for i in readers]
                  if len(rows)!=6 or not all(urls_by_row) or not readers or not any(i.get('pdf_header_only') for i in files):raise RuntimeError('Announced six-row CSV/PDF/reader package not established')
                  report['status']='EXISTING_PUBLIC_RESEARCH_HANDOFF_RECEIVED'
          except Exception as e:
              report['status']='BLOCKED_OR_MISMATCH';report['errors'].append(str(e));sys.exitcode=1
          finally:
              report['finished_utc']=datetime.now(timezone.utc).isoformat()
              print('BEGIN_PUBLIC_HANDOFF_RESULT');print(json.dumps(report,indent=2));print('END_PUBLIC_HANDOFF_RESULT')
          if report['errors']:sys.exit(1)
