name: Receive completed browser files
on:
  push:
    branches: [ops-forensics/admission-language-scan-20261018]
    paths: [.github/workflows/public-browser-receiving.yml]
permissions:
  actions: read
# Recover the prior exact job only. Does not rerun a browser or retry the HTTP403.
# No AI executor, native endpoint, new account, schedule, cache or repository write.
# Only the two public synthetic files, result and manifest enter one 1-day artifact.
jobs:
  receive-public-files:
    if: github.repository == 'opsmark/Ops_missions'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Read completed job log and verify returned byte identities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os,ssl,http.client,urllib.request,urllib.parse,json,base64,hashlib,re
          from pathlib import Path
          job=117831025509
          conn=http.client.HTTPSConnection('api.github.com',timeout=20,context=ssl.create_default_context())
          conn.request('GET',f'/repos/opsmark/Ops_missions/actions/jobs/{job}/logs',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'OPS-own-public-job-receiving','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          r=conn.getresponse()
          if r.status==200:
              raw=r.read(200001)
          elif r.status==302:
              url=r.getheader('Location');u=urllib.parse.urlsplit(url)
              if u.scheme!='https' or not u.hostname or not (u.hostname.endswith('.blob.core.windows.net') or u.hostname.endswith('.actions.githubusercontent.com')):raise RuntimeError('Unrecognized GitHub log download destination')
              # Fresh request deliberately has NO GitHub Authorization header.
              class StopRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,*a,**kw):raise RuntimeError('Unexpected second redirect')
              with urllib.request.build_opener(StopRedirect).open(url,timeout=20) as dl:
                  if dl.status!=200:raise RuntimeError('Log download status')
                  raw=dl.read(200001)
          else:raise RuntimeError('GitHub log request status '+str(r.status))
          conn.close()
          if len(raw)>200000:raise RuntimeError('Log bound')
          lines=[re.sub(r'^\ufeff?\d{4}-\d\d-\d\dT\S+Z ','',x) for x in raw.decode('utf-8-sig').splitlines()]
          first=lines.index('BEGIN_BROWSER_ROUNDTRIP_RESULT');last=lines.index('END_BROWSER_ROUNDTRIP_RESULT',first)
          result=json.loads('\n'.join(lines[first+1:last]))
          if result['status']!='INPUT_DOWNLOAD_REIMPORT_CLEAR_PASS' or not result['owned_process_group_gone'] or not result['owned_profile_and_downloads_removed']:raise RuntimeError('Original acceptance not complete')
          expected={'browser-generated-fixture.json':(188,'91f0f396cd0b042f4c0e5ac351a952dfd9ec4fee651f9e46210bffbf1b6d23ee'),'browser-roundtrip.jpg':(24174,'9c53674ce31e88e22d0b3fe936478d4c3f5832589d0c6f25856b4512155a1c80')}
          out=Path(os.environ['RUNNER_TEMP'])/'ops-public-return';out.mkdir(exist_ok=False)
          for name,(size,digest) in expected.items():
              start=lines.index(f'BEGIN_RETURNED_PUBLIC_FILE {name} {size} {digest}')
              end=lines.index('END_RETURNED_PUBLIC_FILE '+name,start)
              b=base64.b64decode(''.join(lines[start+1:end]),validate=True)
              if len(b)!=size or hashlib.sha256(b).hexdigest()!=digest:raise RuntimeError('Returned bytes mismatch: '+name)
              (out/name).write_bytes(b)
          (out/'result.json').write_text(json.dumps(result,indent=2)+'\n')
          payloads=[{'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.iterdir())]
          if sum(p['bytes'] for p in payloads)>40000:raise RuntimeError('Artifact payload bound')
          manifest={'source_run':39180165574,'source_job':job,'workflow_commit':'9275e831b558dca7a3c49fc72effb389d035c514','source_log_sha256':hashlib.sha256(raw).hexdigest(),'method':'Decode byte-bound files from the completed job log; result.json is a structured extraction, not raw log bytes. No model reconstructed the files.','files':payloads}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
      - name: Return only verified public fixture files for one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ops-public-browser-return-39180165574
          path: |
            ${{ runner.temp }}/ops-public-return/browser-generated-fixture.json
            ${{ runner.temp }}/ops-public-return/browser-roundtrip.jpg
            ${{ runner.temp }}/ops-public-return/result.json
            ${{ runner.temp }}/ops-public-return/manifest.json
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
      - name: Remove only this receiving job's temporary outputs
        if: always()
        shell: python
        run: |
          import os,shutil
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'ops-public-return'
          if p.exists():shutil.rmtree(p)
          assert not p.exists()
          print('OWN_RECEIVING_OUTPUTS_REMOVED')
