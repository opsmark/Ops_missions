name: Public browser input and file return
on:
  push:
    branches: [ops-forensics/admission-language-scan-20261018]
    paths: [.github/workflows/public-browser-receiving.yml]
permissions: {}
# This is a fixed synthetic OFFLINE test, not a retry of the live site's HTTP403.
# No Work/Codex/model API, native machine, checkout, new package, token export,
# signed-in profile, public debug port, scheduler or artifact/cache storage.
# Small public fixture files are returned through the job log with exact hashes.
jobs:
  browser-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Run exact reviewed source using sandboxed installed Chrome
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          test -x /opt/google/chrome/chrome
          dpkg-query -W -f='${Package} ${Version}\n' google-chrome-stable
          dpkg -V google-chrome-stable
          sha256sum /opt/google/chrome/chrome
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          curl --proto '=https' --tlsv1.2 --fail --connect-timeout 15 --max-time 30 --retry 0 'https://raw.githubusercontent.com/opsmark/Ops_missions/c6f07155671ba28732545acd865efcaf8e2494a4/isolated-tests/browser-input-download.mjs' -o "$work/test.mjs"
          printf '%s  %s\n' 'afd18da48a783e827c6b33c2afbadc75cd2b8a2be22f94264cb8e61bf99a7ac8' "$work/test.mjs" | sha256sum --check --strict
          node --check "$work/test.mjs"
          timeout --signal=TERM --kill-after=5 110 node "$work/test.mjs"
