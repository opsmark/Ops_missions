name: Public browser receiving check
on:
  push:
    branches: [ops-forensics/admission-language-scan-20261018]
    paths: [.github/workflows/public-browser-receiving.yml]
permissions: {}
# Purpose-specific source inspection; no package install, secrets, AI executor,
# browser profile, public form submission, artifact storage, or native machine.
jobs:
  brief-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Read the actual public brief module and form controls
        shell: python
        run: |
          import hashlib,json,urllib.request
          from html.parser import HTMLParser
          base='https://ops-workflow-cost-calculator.rass991.chatgpt.site'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**kw):raise RuntimeError('Unexpected redirect; no follow')
          op=urllib.request.build_opener(NoRedirect)
          class Controls(HTMLParser):
              def handle_starttag(self,tag,attrs):
                  if tag in {'input','textarea','select','option','button','form','label','output'}:
                      print(tag,json.dumps(dict(attrs)))
          for path in ['/agency-overflow','/spreadsheet-brief.mjs']:
              with op.open(base+path,timeout=15) as r:
                  b=r.read(100001)
                  if r.status!=200 or len(b)>100000:raise RuntimeError('Status/size gate')
              print('SOURCE',path,len(b),hashlib.sha256(b).hexdigest())
              if path.endswith('.mjs'):
                  if len(b)>24000:raise RuntimeError('Module output bound')
                  print('BEGIN_PUBLIC_BRIEF_SOURCE');print(b.decode());print('END_PUBLIC_BRIEF_SOURCE')
              else:Controls().feed(b.decode())
